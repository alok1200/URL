services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - MAX_FILESIZE_MB=${MAX_FILESIZE_MB:-500}
      - MAX_DURATION_MIN=${MAX_DURATION_MIN:-180}
      - RATE_LIMIT_PER_MIN=${RATE_LIMIT_PER_MIN:-10}
      - MAX_CONCURRENT_PER_IP=${MAX_CONCURRENT_PER_IP:-3}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-3}
      - DOWNLOAD_TIMEOUT_SEC=${DOWNLOAD_TIMEOUT_SEC:-300}
      - COOKIES_FILE=${COOKIES_FILE:-}
      - PROXY_URL=${PROXY_URL:-}
      - LOG_LEVEL=${LOG_LEVEL:-error}
    restart: unless-stopped
    # Uncomment below to mount your own cookies.txt file:
    # volumes:
    #   - ./cookies.txt:/app/cookies.txt:ro
